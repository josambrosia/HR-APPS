<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Josaphat Tech Solution — Glow Pulse (04H)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1f1f1f; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', Consolas, monospace; }
  .stage { background: #0F172A; padding: 28px 36px 22px; border-radius: 14px; box-shadow: 0 12px 48px rgba(0,0,0,0.5); }
  .word-line { font-weight: 700; font-size: 44px; color: #FFFFFF; line-height: 1; display: flex; align-items: center; gap: 6px; }
  .cursor {
    display: inline-block;
    width: 18px;
    height: 40px;
    background: #10B981;
    vertical-align: -3px;
    animation: cursor-pulse 2s ease-in-out infinite, cursor-blink 1s steps(2) infinite;
  }
  .tagline { margin-top: 14px; font-weight: 500; font-size: 16px; color: #94A3B8; letter-spacing: 0.5px; }

  @keyframes cursor-pulse {
    0%, 100% { box-shadow: 0 0 4px #10B981, 0 0 0 #10B981; }
    50%      { box-shadow: 0 0 18px #10B981, 0 0 36px rgba(16, 185, 129, 0.7); }
  }
  @keyframes cursor-blink {
    0%, 50%      { opacity: 1; }
    50.01%, 100% { opacity: 0.25; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="word-line"><span>josaphat</span><span class="cursor"></span></div>
    <div class="tagline">// from concept to code</div>
  </div>
</body>
</html>
