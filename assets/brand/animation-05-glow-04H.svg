<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 130" width="480" height="130" role="img" aria-label="Josaphat Tech Solution glow pulse animation">
  <title>Josaphat Tech Solution — Glow Pulse Animation</title>
  <desc>Animated wordmark with green cursor that pulses with glow and blinks. Loops every 2 seconds. Calm, ambient.</desc>
  <style>
    .word { font: 700 44px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; fill: #FFFFFF; }
    .tag  { font: 500 16px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; fill: #94A3B8; letter-spacing: 0.5px; }
  </style>
  <defs>
    <filter id="cursorGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2" result="blur">
        <animate attributeName="stdDeviation"
                 values="1; 8; 1"
                 dur="2s"
                 repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="480" height="130" fill="#0F172A"/>
  <text x="36" y="70" class="word" textLength="216" lengthAdjust="spacingAndGlyphs">josaphat</text>
  <rect x="260" y="36" width="20" height="40" fill="#10B981" filter="url(#cursorGlow)">
    <animate attributeName="opacity"
             values="1; 1; 0.25; 0.25; 1"
             keyTimes="0; 0.45; 0.5; 0.95; 1"
             dur="1s"
             repeatCount="indefinite"/>
  </rect>
  <text x="36" y="102" class="tag">// from concept to code</text>
</svg>
